<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassIQ - Courses</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/courses.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="courses-page">
      <div class="container">
        <section class="course-hero">
          <div class="hero-content">
            <h1 class="fw-semibold">Enroll in Your Fav Courses</h1>
          </div>

          <div class="hero-image">
            <div class="hero-img-back">

            </div>
            <img
              src="../assets/courses-hero-img.svg"
              alt="Student"
              height="256"
              width="324"
            />
          </div>
        </section>

        <section class="all-courses">
          <div class="section-title">
            <h2>All Courses</h2>
            <span>➜</span>
          </div>
          <div class="container text-center">
            <div
              id="course-container"
              class="row row-cols-auto gap-5 align-items-center justify-content-between"
            ></div>
          </div>
        </section>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/course.js"></script>
   
  </body>
</html>
