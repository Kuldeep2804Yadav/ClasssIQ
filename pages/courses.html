<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
    <meta
      name="description"
      content="Explore ClassIQ courses in web development, UX design, data science, and business skills with practical, career-focused learning paths."
    />
    <meta
      name="keywords"
      content="online courses, web development courses, design courses, data science training, business courses, ClassIQ"
    />
    <meta name="author" content="ClassIQ" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ClassIQ - Courses" />
    <meta
      property="og:description"
      content="Browse high-impact online courses designed to help you build modern skills and advance your career."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="../assets/Logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassIQ - Courses" />
    <meta
      name="twitter:description"
      content="Explore career-focused courses in technology, design, and business from ClassIQ."
    />
    <title>ClassIQ - Courses</title>
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/courses.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "ClassIQ Courses",
        "description": "Career-focused online courses in technology, design, and business skills.",
        "provider": {
          "@type": "Organization",
          "name": "ClassIQ"
        },
        "educationalLevel": "Beginner to Advanced",
        "learningResourceType": "Course"
      }
    </script>
  </head>

  <body>
    <div id="navbar"></div>

    <main class="courses-page">
      <div class="container">
        <section class="course-hero">
          <div class="hero-content">
            <h1 class="fw-semibold">Enroll in Your Fav Courses</h1>
          </div>

          <div class="hero-image">
            <div class="hero-img-back">

            </div>
            <img
              src="../assets/courses-hero-img.svg"
              alt="Student"
              height="256"
              width="324"
            />
          </div>
        </section>

        <section class="all-courses">
          <div class="section-title">
            <h2>All Courses</h2>
            <span>➜</span>
          </div>
          <div class="container text-center">
            <div
              id="course-container"
              class="row row-cols-auto gap-5 align-items-center justify-content-between"
            ></div>
          </div>
        </section>
      </div>
    </main>
 <div id="toast"></div>

    <div id="footer"></div>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/course.js"></script>
   
  </body>
</html>
