<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassIQ - Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="signup-section container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-3 mt-4">
          <div
            class="signup-card py-5 px-3 mx-auto d-flex flex-column row-gap-3"
          >
            <h2 class="signup-title text-center fw-bold mb-4">Signup</h2>

            <form class="d-flex flex-column row-gap-4" onsubmit="signup(event)">
              <div class="d-flex flex-column">
                <div class="mb-3">
                  <input
                    type="email"
                    class="form-control fw-semibold"
                    placeholder="Enter Your Email"
                    name="email"
                  />
                  <small id="email-error" class="text-danger"></small>
                </div>
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control fw-semibold"
                    placeholder="Enter Your Fullname"
                    name="fullname"
                  />
                  <small id="fullname-error" class="text-danger"></small>
                </div>

                <div class="mb-2">
                  <input
                    type="password"
                    class="form-control fw-semibold"
                    placeholder="Enter Your Password"
                    name="password"
                  />
                  <small id="password-error" class="text-danger"></small>
                </div>
              </div>

              <button
                type="submit"
                class="btn signup-btn fw-semibold text-center w-100"
              >
                Signup
              </button>
            </form>

            <p class="signup-text text-center mt-4 mb-0 fw-semibold">
              Already have an account?

              <a href="signin.html"> Signin </a>
            </p>
          </div>
        </div>
      </div>
    </main>
    
    
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/signup.js"></script>
  </body>
</html>
