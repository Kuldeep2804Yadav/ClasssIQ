<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ClassIQ - Sign In</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/signin.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="signin-section container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-3 mt-4">
          <div class="signin-card py-5 px-3 mx-auto d-flex flex-column row-gap-3">
            <h2 class="signin-title text-center fw-bold mb-4">Login</h2>

            <form class="d-flex flex-column row-gap-4">
              <div class="d-flex flex-column">
                <div class="mb-3">
                  <input
                    type="email"
                    class="form-control fw-semibold"
                    placeholder="Enter Your Email"
                    required
                  />
                </div>

                <div class="mb-2">
                  <input
                    type="password"
                    class="form-control fw-semibold"
                    placeholder="Enter Your Password"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn signin-btn fw-semibold text-center w-100"
              >
                SignIn
              </button>
            </form>

            <p class="signup-text text-center mt-4 mb-0 fw-semibold">
              Don't have an account?

              <a href="signup.html"> SignUp </a>
            </p>
          </div>
        </div>
      </div>
    </main>

  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
