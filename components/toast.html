<div class="toast-container position-fixed top-0 end-0 p-3">
  <div
    id="appToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-header">
      <strong class="me-auto" id="toast-title">Notification</strong>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>

    <div class="toast-body" id="toast-message">Sign up successfully</div>
  </div>
</div>
